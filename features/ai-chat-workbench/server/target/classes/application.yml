server:
  port: 8081

spring:
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  ai:
    timeout-seconds: 15
    api-key: ${AI_API_KEY:sk-your-api-key}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  token:
    daily-limit: 50000

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_chat_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_chat_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false