server:
  port: ${SERVER_PORT:8085}

spring:
  profiles:
    default: local
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  ai:
    timeout-seconds: 15
    api-key: ${AI_API_KEY:sk-your-api-key}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  token:
    daily-limit: 50000

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${XM4_MYSQL_URL:jdbc:mysql://REPLACE_WITH_XM4_HOST:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.3&verifyServerCertificate=true}
    username: ${XM4_MYSQL_USERNAME:REPLACE_WITH_XM4_USERNAME}
    password: ${XM4_MYSQL_PASSWORD:REPLACE_WITH_XM4_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${XM4_MYSQL_URL:jdbc:mysql://REPLACE_WITH_XM4_HOST:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.3&verifyServerCertificate=true}
    username: ${XM4_MYSQL_USERNAME:REPLACE_WITH_XM4_USERNAME}
    password: ${XM4_MYSQL_PASSWORD:REPLACE_WITH_XM4_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false