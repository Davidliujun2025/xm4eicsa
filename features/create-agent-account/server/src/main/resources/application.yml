spring:
  application:
    name: create-agent-account-backend

  datasource:
    url: "${XM4_MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/carepilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}"
    username: "${XM4_MYSQL_USERNAME:${DB_USERNAME:root}}"
    password: "${XM4_MYSQL_PASSWORD:${DB_PASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_create_agent_account
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8083}