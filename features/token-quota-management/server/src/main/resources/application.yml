server:
  port: 8081

spring:
  application:
    name: token-quota-backend
  profiles:
    default: memory

carepilot:
  token-quota:
    default-page-size: 20
    max-page-size: 100
    max-daily-quota: 10000000
    high-usage-threshold: 0.8

---
spring:
  config:
    activate:
      on-profile: memory
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TOKEN_QUOTA_DB_URL:${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/xm4?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}}
    username: ${TOKEN_QUOTA_DB_USERNAME:${MYSQL_USERNAME:root}}
    password: ${TOKEN_QUOTA_DB_PASSWORD:${MYSQL_PASSWORD:change_me}}
  sql:
    init:
      mode: never
