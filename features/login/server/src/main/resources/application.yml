spring:
  application:
    name: ai-customer-service-login
  datasource:
    url: ${XM4_MYSQL_URL:jdbc:mysql://REPLACE_WITH_XM4_HOST:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.3&verifyServerCertificate=true}
    username: ${XM4_MYSQL_USERNAME:REPLACE_WITH_XM4_USERNAME}
    password: ${XM4_MYSQL_PASSWORD:REPLACE_WITH_XM4_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    issuer: ${JWT_ISSUER:ai-customer-service-login}
    jwt-secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    access-ttl: 15m
    session-refresh-ttl: 8h
    remembered-refresh-ttl: 30d
    secure-cookies: ${SECURE_COOKIES:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5500,http://127.0.0.1:5600,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5500,http://localhost:5600}
    allow-plain-password-debug: ${APP_AUTH_ALLOW_PLAIN_PASSWORD_DEBUG:${ALLOW_PLAIN_PASSWORD_DEBUG:false}}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
