spring:
  application:
    name: ai-customer-service-login
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_customer_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    issuer: ${JWT_ISSUER:ai-customer-service-login}
    jwt-secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    access-ttl: 15m
    session-refresh-ttl: 8h
    remembered-refresh-ttl: 30d
    secure-cookies: ${SECURE_COOKIES:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
