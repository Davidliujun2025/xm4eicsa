server:
  port: 8081

spring:
  application:
    name: token-quota-backend
  profiles:
    default: memory

carepilot:
  token-quota:
    default-page-size: 20
    max-page-size: 100
    max-daily-quota: 10000000
    high-usage-threshold: 0.8

---
spring:
  config:
    activate:
      on-profile: memory
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${XM4_MYSQL_URL:jdbc:mysql://REPLACE_WITH_XM4_HOST:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.3&verifyServerCertificate=true}
    username: ${XM4_MYSQL_USERNAME:REPLACE_WITH_XM4_USERNAME}
    password: ${XM4_MYSQL_PASSWORD:REPLACE_WITH_XM4_PASSWORD}
  sql:
    init:
      mode: never
