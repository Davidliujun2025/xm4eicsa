server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: xm4eicsa
  profiles:
    default: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/xm4
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  auth:
    issuer: ${JWT_ISSUER:xm4eicsa}
    jwt-secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    session-refresh-ttl: ${JWT_REFRESH_TTL:PT8H}
    remembered-refresh-ttl: ${JWT_REMEMBERED_REFRESH_TTL:P30D}
    secure-cookies: ${SECURE_COOKIES:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179,http://127.0.0.1:5180,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://127.0.0.1:15173,http://127.0.0.1:15174,http://127.0.0.1:15175,http://127.0.0.1:15176,http://127.0.0.1:15177,http://127.0.0.1:15178,http://127.0.0.1:15179,http://127.0.0.1:15180,http://localhost:15173,http://localhost:15174,http://localhost:15175,http://localhost:15176,http://localhost:15177,http://localhost:15178,http://localhost:15179,http://localhost:15180,http://127.0.0.1:5500,http://localhost:5500}
    allow-plain-password-debug: ${ALLOW_PLAIN_PASSWORD_DEBUG:false}
  ai:
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    api-key: ${DEEPSEEK_API_KEY:${AI_API_KEY:}}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-v4-flash}
    max-tokens: ${AI_MAX_TOKENS:1400}
    thinking-enabled: ${AI_THINKING_ENABLED:false}
  cache:
    sync-window-minutes: ${FORBIDDEN_WORD_CACHE_SYNC_MINUTES:5}
  script-library:
    max-size: ${SCRIPT_LIBRARY_MAX_SIZE:200}
  token-monitor:
    zone: ${TOKEN_MONITOR_ZONE:Asia/Shanghai}
    default-daily-limit: ${TOKEN_MONITOR_DAILY_TOKEN_LIMIT:0}
    high-usage-threshold: ${TOKEN_MONITOR_HIGH_USAGE_THRESHOLD:0.80}
    failure-rate-threshold: ${TOKEN_MONITOR_FAILURE_RATE_THRESHOLD:0.20}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  evaluation:
    weights:
      service-attitude: ${EVALUATION_WEIGHT_SERVICE_ATTITUDE:20}
      problem-solving: ${EVALUATION_WEIGHT_PROBLEM_SOLVING:25}
      empathy: ${EVALUATION_WEIGHT_EMPATHY:15}
      compliance: ${EVALUATION_WEIGHT_COMPLIANCE:20}
      conversion-guidance: ${EVALUATION_WEIGHT_CONVERSION_GUIDANCE:15}
      response-efficiency: ${EVALUATION_WEIGHT_RESPONSE_EFFICIENCY:5}

carepilot:
  password-reset:
    reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    code-ttl: ${PASSWORD_RESET_CODE_TTL:5m}
    code-cooldown: ${PASSWORD_RESET_CODE_COOLDOWN:60s}
    code-length: ${PASSWORD_RESET_CODE_LENGTH:6}
    username-pattern: ${PASSWORD_RESET_USERNAME_PATTERN:^[A-Za-z0-9_@.-]{4,64}$}
