server:
  port: ${SERVER_PORT:8085}

spring:
  profiles:
    default: local
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  ai:
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    api-key: ${DEEPSEEK_API_KEY:${AI_API_KEY:}}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-v4-flash}
    max-tokens: ${AI_MAX_TOKENS:1400}
    thinking-enabled: ${AI_THINKING_ENABLED:false}
    log-request: ${AI_LOG_REQUESTS:false}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/xm4?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${XM4_MYSQL_URL:jdbc:mysql://REPLACE_WITH_XM4_HOST:3306/xm4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.3&verifyServerCertificate=true}
    username: ${XM4_MYSQL_USERNAME:REPLACE_WITH_XM4_USERNAME}
    password: ${XM4_MYSQL_PASSWORD:REPLACE_WITH_XM4_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
